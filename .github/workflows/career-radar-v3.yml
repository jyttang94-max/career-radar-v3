name: Career Radar V3 Daily
on:
  schedule:
    - cron: '0 23 * * *' # 08:00 KST
  workflow_dispatch:
    inputs:
      mode:
        description: dry_run or live
        type: choice
        required: true
        default: dry_run
        options: [dry_run, live]
permissions:
  contents: write
concurrency:
  group: career-radar-v3
  cancel-in-progress: false
jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Search and notify
        env:
          RADAR_MODE: ${{ github.event_name == 'schedule' && 'live' || inputs.mode }}
          NAVER_MAIL_USER: ${{ secrets.NAVER_MAIL_USER }}
          NAVER_MAIL_PASSWORD: ${{ secrets.NAVER_MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python career_radar_v3.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radar-report
          path: |
            career_radar_report.json
            career_radar_preview.html
          if-no-files-found: ignore
      - name: Commit sent history
        if: success() && (github.event_name == 'schedule' || inputs.mode == 'live')
        run: |
          if [ -f data/seen_jobs.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/seen_jobs.json
            git diff --cached --quiet || (git commit -m 'Update sent jobs' && git push)
          fi
